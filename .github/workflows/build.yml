name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build DJTrans.slnx -c Release
      - name: Test
        run: dotnet test tests/DJTrans.Core.Tests -c Release --logger "trx" --results-directory TestResults
