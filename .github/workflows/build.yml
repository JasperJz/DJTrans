name: build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build DJTrans.slnx -c Release
      - name: Test
        run: dotnet test tests/DJTrans.Core.Tests -c Release --logger "trx" --results-directory TestResults
