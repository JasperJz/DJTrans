name: build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build DJTrans.slnx -c Release
      - name: Test
        run: dotnet test tests/DJTrans.Core.Tests -c Release --logger "trx" --results-directory TestResults
