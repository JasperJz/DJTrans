name: release

on:
  push:
    tags: [ 'v*' ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并挂载资产的版本标签（如 v0.9.0，须已存在）'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          [xml]$project = Get-Content src/DJTrans/DJTrans.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -cne "v$version") { throw "Tag must match project version v$version" }

      - name: Test
        run: dotnet test tests/DJTrans.Core.Tests -c Release

      - name: Publish (self-contained, no runtime needed)
        run: dotnet publish src/DJTrans -c Release -r win-x64 -o publish-sc -p:PublishSingleFile=true -p:SelfContained=true -p:EnableCompressionInSingleFile=true -p:DebugType=none
      - name: Publish (framework-dependent, needs .NET 10 Desktop Runtime)
        run: dotnet publish src/DJTrans -c Release -r win-x64 -o publish-fd -p:PublishSingleFile=true -p:SelfContained=false -p:DebugType=none

      - name: Package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish-sc/* -DestinationPath "dist/DJTrans-$tag-win-x64-self-contained.zip"
          Compress-Archive -Path publish-fd/* -DestinationPath "dist/DJTrans-$tag-win-x64-framework-dependent.zip"
          Get-ChildItem dist/*.zip | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding utf8
          Get-ChildItem dist

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
